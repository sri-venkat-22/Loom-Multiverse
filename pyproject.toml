[project]
name = "loom-cli"
version = "0.1.0"
description = "CLI that takes a founder's idea and produces a working, tested codebase."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.scripts]
loom = "loom.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not live'"
markers = ["live: hits real provider APIs, costs money"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
