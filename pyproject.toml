[project]
name = "loom-cli"
version = "0.1.0"
description = "CLI that takes a founder's idea and produces a working, tested codebase."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The Loom Authors" }]
keywords = ["agent", "codegen", "llm", "cli", "scaffold", "founder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "litellm>=1.98.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/sri-venkat-22/Loom-Multiverse"
Repository = "https://github.com/sri-venkat-22/Loom-Multiverse"
Issues = "https://github.com/sri-venkat-22/Loom-Multiverse/issues"

[project.scripts]
loom = "loom.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits real provider APIs, costs money. Skipped unless `-m live` (see tests/conftest.py)",
    "slow: real git repositories and full build loops. Excluded from the on-every-save tier",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
